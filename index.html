<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeWall" />
    <title>HomeWall</title>
    <style>
      body {
        margin: 0;
        background: #0b1220;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Plain (non-module) diagnostics: runs even if the app bundle fails to parse. -->
    <div
      id="boot-error"
      style="display:none;margin:16px;padding:16px;border:1px solid #ef4444;border-radius:12px;background:#131c2e;color:#e6edf7;font:14px/1.5 system-ui,sans-serif"
    >
      <strong id="boot-error-title" style="color:#ef4444">Something went wrong</strong>
      <pre id="boot-error-detail" style="white-space:pre-wrap;margin:8px 0 0;color:#93a4bd"></pre>
    </div>
    <noscript style="display:block;margin:16px;color:#e6edf7;font:14px system-ui,sans-serif">
      HomeWall needs JavaScript enabled.
    </noscript>

    <script>
      ;(function () {
        function show(title, detail) {
          var box = document.getElementById('boot-error')
          if (!box) return
          box.style.display = 'block'
          var t = document.getElementById('boot-error-title')
          var d = document.getElementById('boot-error-detail')
          if (t) t.textContent = title
          if (d) d.textContent = detail
        }
        window.addEventListener('error', function (e) {
          var where = e && e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : ''
          show('Startup error', ((e && e.message) || 'Unknown error') + where)
        })
        window.addEventListener('unhandledrejection', function (e) {
          show('Startup error', String((e && e.reason) || 'Unhandled promise rejection'))
        })
        setTimeout(function () {
          var root = document.getElementById('root')
          if (root && root.childNodes.length === 0) {
            show('The app did not start', 'Nothing rendered after 5s.\nBrowser: ' + navigator.userAgent)
          }
        }, 5000)
      })()
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
